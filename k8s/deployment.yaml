apiVersion: apps/v1
kind: Deployment
metadata:
  name: damo-app
  namespace: damo-app
  labels:
    app: damo-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: damo-app
  template:
    metadata:
      labels:
        app: damo-app
    spec:
      containers:
        - name: damo-app
          # 占位符：流水线用 sed 替换为 11.0.1.128:30000/damo-app:<构建号>
          image: __IMAGE__
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          startupProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
